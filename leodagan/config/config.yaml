model:
  provider: openai-codex
  default: gpt-5.6-terra
agent:
  max_turns: 18
  reasoning_effort: medium
memory:
  memory_enabled: true
  user_profile_enabled: true
sessions:
  auto_prune: false
skills:
  project_discovery: false
  inline_shell: false
  write_approval: true
platform_toolsets:
  slack: [memory, session_search, leodagan_editorial]
  telegram: [memory, session_search, leodagan_editorial]
  cli: [memory, session_search, leodagan_editorial]
  api_server: []
  cron: []
gateway:
  allow_all_users: false
slack:
  enabled: true
  require_mention: true
  reply_in_thread: true
  disable_dms: true
  allow_admin_from: ["__no_admin__"]
  group_allow_admin_from: ["__no_admin__"]
  user_allowed_commands: [help, whoami, new, stop]
  group_user_allowed_commands: [help, whoami, new, stop]
telegram:
  enabled: true
  dm_policy: allowlist
  group_policy: disabled
  allow_admin_from: ["__no_admin__"]
  group_allow_admin_from: ["__no_admin__"]
  user_allowed_commands: [help, whoami, new, stop]
  group_user_allowed_commands: [help, whoami, new, stop]
platforms:
  telegram:
    extra:
      command_menu:
        max_commands: 4
        priority_mode: replace
        priority: [help, whoami, new, stop]
plugins:
  enabled: [leodagan-editorial]
  auto_update_check_hours: 0
