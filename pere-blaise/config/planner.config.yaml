# Configuration du conteneur Hermes de Père Blaise.
# Les données de bibliothèque arrivent déjà réduites dans la requête API : aucun outil de fichier n'est requis.
model:
  provider: openai-codex
  default: gpt-6-luna

platform_toolsets:
  api_server: []

# Décision du propriétaire le 2026-10-14 : F-013/F-014 reportées.
# Aucun apprentissage ni mémoire générale n'est utilisé ; les anciennes tables
# SQLite et backups restent conservés, sans transmission au modèle.
memory:
  memory_enabled: false
  user_profile_enabled: false

agent:
  max_turns: 4
  verbose: false
  reasoning_effort: low

gateway:
  allow_all_users: false
  media_delivery_allow_dirs: []
