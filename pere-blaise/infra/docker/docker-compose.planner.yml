name: hermes-pere-blaise

# Deployment template.  Run only with --env-file pointing at a private host file.
services:
  pere-blaise:
    image: nousresearch/hermes-agent@sha256:9774f4f39a9bb8c2f68ce728ed5e99ddbad282163be56764afacf88ed952b784
    container_name: hermes-pere-blaise
    restart: unless-stopped
    command: ["gateway", "run"]
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1536m
    security_opt: [no-new-privileges:true]
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${PERE_BLAISE_API_KEY}
    ports:
      - "127.0.0.1:8643:8642"
    volumes:
      - hermes-pere-blaise-data:/opt/data
      - ${PERE_BLAISE_CONFIG_FILE}:/opt/data/config.yaml:ro
    # The current Hermes image needs its init capabilities and a writable /run.
    # Do not add cap_drop or read_only until a compatible image has passed a
    # Docker Desktop startup test for this agent.
    # Deliberately absent: Telegram token, Documents, Downloads, $HOME, Docker socket, broker socket.

volumes:
  hermes-pere-blaise-data:
    name: hermes-pere-blaise-data
    external: true
