name: hermes-pere-blaise

# Deployment template.  Run only with --env-file pointing at a private host file.
services:
  planner:
    image: nousresearch/hermes-agent@sha256:9774f4f39a9bb8c2f68ce728ed5e99ddbad282163be56764afacf88ed952b784
    container_name: hermes-pere-blaise
    restart: unless-stopped
    command: ["gateway", "run"]
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1536m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_PLANNER_API_KEY}
    ports:
      - "127.0.0.1:8643:8642"
    volumes:
      - hermes-pere-blaise-data:/opt/data
      - ${HERMES_PLANNER_AUTH_FILE}:/opt/data/auth.json:ro
      - ${HERMES_PLANNER_CONFIG_FILE}:/opt/data/config.yaml:ro
    # read_only remains disabled: Hermes' current Docker Desktop init requires /run.
    # Deliberately absent: Telegram token, Documents, Downloads, $HOME, Docker socket, broker socket.

volumes:
  hermes-pere-blaise-data:
    name: hermes-pere-blaise-data
