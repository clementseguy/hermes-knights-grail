# Template only: do not apply automatically.
# The final unified Hermes planner must not receive Docker's socket or the broker socket.
services:
  hermes-organizer:
    image: nousresearch/hermes-agent@sha256:REPLACE_WITH_REVIEWED_DIGEST
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1536m
    volumes:
      - hermes-unified-planner-data:/opt/data
      - ../config/planner.config.yaml:/opt/data/config.yaml:ro
    # Explicitly absent: Documents, Downloads, /var/run/docker.sock, $HOME and the broker socket.
    environment:
      # This is an internal planner only: it has no Telegram token.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_PLANNER_API_KEY}
    ports:
      - "127.0.0.1:8643:8642"
